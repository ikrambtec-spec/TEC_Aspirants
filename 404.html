<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>পৃষ্ঠাটি খুঁজে পাওয়া যায়নি | TEC Aspirants</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-slate-50 dark:bg-[#08090d] text-slate-800 dark:text-slate-100 min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-white dark:bg-[#111218] rounded-3xl p-8 border border-slate-200 dark:border-pitch-border shadow-2xl text-center space-y-5 animate-modal-scale">
    <div class="w-20 h-20 rounded-3xl bg-emerald-50 dark:bg-emerald-950/50 text-emerald-600 dark:text-emerald-400 mx-auto flex items-center justify-center text-3xl shadow-lg shadow-emerald-500/20">
      <i class="fa-solid fa-compass"></i>
    </div>

    <div>
      <span class="text-xs font-black tracking-widest uppercase text-emerald-600 dark:text-emerald-400">Error 404</span>
      <h1 class="text-2xl font-extrabold text-slate-900 dark:text-white mt-1">পৃষ্ঠাটি খুঁজে পাওয়া যায়নি</h1>
      <p class="text-xs text-slate-500 dark:text-slate-400 mt-2 leading-relaxed">
        আপনি যে লিংকটি খুঁজছেন তা হয়তো সরানো হয়েছে অথবা ঠিকানাটি ভুলভাবে লেখা হয়েছে।
      </p>
    </div>

    <div class="pt-2">
      <a href="/" 
         class="inline-flex items-center justify-center gap-2 w-full py-3 px-5 rounded-2xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm shadow-lg shadow-emerald-600/30 transition-all">
        <i class="fa-solid fa-house"></i>
        <span>হোমপেজে ফিরে যান</span>
      </a>
    </div>

    <p class="text-[11px] text-slate-400 pt-2 border-t border-slate-100 dark:border-slate-800/80">
      TEC Aspirants • ১০টি সরকারি টেক্সটাইল কলেজ ভর্তি সেল
    </p>
  </div>

  <script>
    // Detect & apply stored theme
    const theme = localStorage.getItem('tec_theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    if (theme === 'dark') document.documentElement.classList.add('dark');
  </script>
</body>
</html>
